# The git root is the luandun monorepo, so paths are relative to it; `files` keeps every hook
# inside desi/. The installed git hook runs stellar_pop/fsps_agb's config, so run this one
# explicitly: uv run pre-commit run --config desi/.pre-commit-config.yaml --all-files
files: ^desi/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
